<!DOCTYPE html>
<html lang="th">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบ | QRAttendance System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 520px;
            min-height: 560px;

            background: white;

            padding: 55px;

            border-radius: 16px;

            box-shadow:
                0 6px 25px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;

            margin-bottom: 40px;
        }

        .logo h1 {
            margin: 0;

            font-size: 34px;

            color: #222;

            white-space: nowrap;
        }

        .logo p {
            margin-top: 12px;

            font-size: 18px;

            color: #777;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 10px;

            font-weight: bold;

            font-size: 17px;

            color: #333;
        }

        input {
            width: 100%;

            padding: 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 17px;
        }

        input:focus {
            outline: none;

            border-color: #555;
        }

        button {
            width: 100%;

            padding: 16px;

            margin-top: 5px;

            border: none;

            border-radius: 8px;

            background: #222;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .error {
            background: #ffe5e5;

            color: #cc0000;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 25px;

            text-align: center;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .login-box {
                width: 100%;

                min-height: auto;

                padding: 30px;
            }

            .logo h1 {
                font-size: 27px;

                white-space: normal;
            }

            .logo p {
                font-size: 16px;
            }

        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">

            <h1>QRAttendance System</h1>

            <p>
                ระบบเช็คชื่อด้วย QR CODE
            </p>

        </div>


        {% if form.errors %}

            <div class="error">

                ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง

            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}

            <!-- เก็บ URL เดิมก่อนเข้าสู่หน้า Login -->

            <input
                type="hidden"
                name="next"
                value="{{ request.GET.next }}"
            >


            <div class="form-group">

                <label for="id_username">
                    ชื่อผู้ใช้
                </label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    placeholder="กรอกชื่อผู้ใช้"
                    required
                >

            </div>


            <div class="form-group">

                <label for="id_password">
                    รหัสผ่าน
                </label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    placeholder="กรอกรหัสผ่าน"
                    required
                >

            </div>


            <button type="submit">
                เข้าสู่ระบบ
            </button>

        </form>

    </div>

</body>

</html>
