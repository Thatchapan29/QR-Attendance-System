<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <title>ลบรายวิชา | QRAttendance System</title>
</head>

<body>

    <h1>ลบรายวิชา</h1>

    <p>
        คุณต้องการลบรายวิชานี้หรือไม่?
    </p>

    <h3>
        {{ course.course_code }}
        -
        {{ course.course_name }}
    </h3>

    <form method="post">

        {% csrf_token %}

        <button type="submit">
            ยืนยันการลบ
        </button>

    </form>

    <br>

    <a href="{% url 'course_list' %}">
        ยกเลิก
    </a>

</body>

</html>
