<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>สร้างการเช็คชื่อ | QRAttendance System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 30px;
            color: #222;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* Header */

        .header {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0 0 12px;
            font-size: 32px;
        }

        .header p {
            margin: 0;
            font-size: 17px;
            color: #555;
        }

        /* Main Card */

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            margin: 0 0 25px;
            font-size: 24px;
        }

        /* Form */

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 17px;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ccc;
            border-radius: 9px;
            background: white;
            font-size: 16px;
            color: #333;
            cursor: pointer;
        }

        select:focus {
            outline: none;
            border-color: #555;
        }

        /* Duration */

        .duration-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f5f5f5;
            padding: 18px 20px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .duration-label {
            font-size: 16px;
            color: #555;
        }

        .duration-value {
            font-size: 20px;
            font-weight: bold;
        }

        /* Start Button */

        .start-button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #222;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-button:hover {
            opacity: 0.85;
        }

        /* Back Button */

        .back-area {
            margin-top: 20px;
        }

        .back-button {
            display: inline-block;
            padding: 11px 18px;
            background: white;
            color: #333;
            text-decoration: none;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-weight: bold;
        }

        .back-button:hover {
            background: #f1f1f1;
        }

        /* Responsive */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .header,
            .card {
                padding: 22px;
            }

            .header h1 {
                font-size: 27px;
            }

            .card h2 {
                font-size: 21px;
            }

            .duration-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }

            .start-button {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->

    <div class="header">

        <h1>สร้างการเช็คชื่อ</h1>

        <p>
            อาจารย์:
            <strong>{{ user.username }}</strong>
        </p>

    </div>


    <!-- Form Card -->

    <div class="card">

        <h2>ตั้งค่าการเช็คชื่อ</h2>

        <form method="post">

            {% csrf_token %}

            <!-- Course -->

            <div class="form-group">

                <label for="course">
                    เลือกรายวิชา
                </label>

                <select
                    name="course"
                    id="course"
                    required
                >

                    <option value="">
                        -- เลือกรายวิชา --
                    </option>

                    {% for course in courses %}

                        <option value="{{ course.id }}">
                            {{ course.course_code }}
                            -
                            {{ course.course_name }}
                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- Duration -->

            <div class="duration-box">

                <span class="duration-label">
                    ระยะเวลาเช็คชื่อ
                </span>

                <span class="duration-value">
                    6 นาที
                </span>

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="start-button"
            >
                เริ่มเช็คชื่อ
            </button>

        </form>

    </div>


    <!-- Back -->

    <div class="back-area">

        <a
            href="{% url 'dashboard' %}"
            class="back-button"
        >
            ← กลับหน้า Dashboard
        </a>

    </div>

</div>

</body>

</html>
