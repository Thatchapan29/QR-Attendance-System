{% extends 'attendance/base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-danger text-white">

            <h3>ลบรอบเช็กชื่อ</h3>

        </div>

        <div class="card-body">

            <p>

                ต้องการลบรอบเช็กชื่อของ

                <strong>

                    {{ session.course }}

                </strong>

                ใช่หรือไม่?

            </p>

            <form method="POST">

                {% csrf_token %}

                <button class="btn btn-danger">

                    ยืนยันการลบ

                </button>

                <a href="{% url 'attendance_sessions' %}"
                   class="btn btn-secondary">

                    ยกเลิก

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
