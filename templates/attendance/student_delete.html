{% extends 'attendance/base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card border-danger">

        <div class="card-header bg-danger text-white">
            <h3>ยืนยันการลบนักศึกษา</h3>
        </div>

        <div class="card-body">

            <p>
                คุณต้องการลบนักศึกษาคนนี้ใช่หรือไม่?
            </p>

            <ul>
                <li><strong>รหัสนักศึกษา :</strong> {{ student.student_id }}</li>
                <li><strong>ชื่อ :</strong> {{ student.first_name }} {{ student.last_name }}</li>
                <li><strong>Email :</strong> {{ student.email }}</li>
            </ul>

            <form method="POST">

                {% csrf_token %}

                <button type="submit" class="btn btn-danger">
                    ยืนยันการลบ
                </button>

                <a href="{% url 'students' %}" class="btn btn-secondary">
                    ยกเลิก
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
