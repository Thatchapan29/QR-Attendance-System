{% extends 'attendance/base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            <h3>{{ title }}</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">
                    บันทึก
                </button>

                <a href="{% url 'students' %}" class="btn btn-secondary">
                    ยกเลิก
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
